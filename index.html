<!DOCTYPE html>
<html lang="id">
  <head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Modern</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <h1>Kalkulator</h1>
      <p class="subtitle">Kalkulator sederhana dan modern</p>

      <!-- Layar kalkulator -->
      <div class="display">
        <div id="history"></div>
        <input type="text" id="result" value="0" readonly />
      </div>

      <!-- Tombol kalkulator -->
      <div class="buttons">
        <button class="special" onclick="clearDisplay()">C</button>
        <button class="special" onclick="deleteNumber()">DEL</button>
        <button class="operator" onclick="appendOperator('%')">%</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>

      <p class="footer">Created with HTML, CSS & JavaScript</p>
    </div>

    <!-- Menghubungkan file JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
